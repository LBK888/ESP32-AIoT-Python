[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-aquarium-dashboard"
version = "1.0.0"
description = "LAN-first ESP32 MicroPython smart aquarium dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "CC-BY-4.0" }
authors = [{ name = "Smart Aquarium Web App contributors" }]
dependencies = [
  "fastapi>=0.139,<0.140",
  "uvicorn[standard]>=0.51,<0.52",
]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.1,<3"]
test = [
  "httpx2>=2.7,<3",
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
]

[project.scripts]
aquarium-dashboard = "aquarium_app.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["aquarium_app*"]

[tool.setuptools.package-data]
aquarium_app = ["schema.sql", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
